baseURL = "https://sandeep-alajangi.github.io/"
languageCode = "en-us"
title = "Sandeep Alajangi | System Architecture"
theme = "github.com/adityatelange/hugo-PaperMod"

[module]
  [[module.imports]]
    path = "github.com/adityatelange/hugo-PaperMod"

[params]
  env = "production"
  defaultTheme = "dark" # Enforces the techie dark mode
  description = "Staff AI Infrastructure Engineer"
  author = "Sandeep Alajangi"
  ShowReadingTime = true
  ShowCodeCopyButtons = true # Essential for code snippets
  ShowToc = true
  
[params.profileMode]
  enabled = true
  title = "Sandeep Alajangi"
  subtitle = "Staff Systems & AI Infrastructure Engineer @ Google. Architecting exabyte-scale ML infrastructure and ultra-low-latency C++ systems."
  
  [[params.profileMode.buttons]]
    name = "GitHub"
    url = "https://github.com/sandeep-alajangi"
  [[params.profileMode.buttons]]
    name = "LinkedIn"
    url = "https://linkedin.com/in/your-linkedin"

[menu]
  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/"
    weight = 10
  [[menu.main]]
    identifier = "github"
    name = "GitHub"
    url = "https://github.com/sandeep-alajangi"
    weight = 20
