baseURL = "https://sandeep-alajangi.github.io/"
languageCode = "en-us"
title = "Sandeep Alajangi | Terminal"
theme = "github.com/panr/hugo-theme-terminal/v4"

[module]
  [[module.imports]]
    path = "github.com/panr/hugo-theme-terminal/v4"

[params]
  # Terminal theme settings
  themeColor = "green" # Options: orange, blue, red, green, pink
  showMenuItems = 2
  showLogo = true
  logoText = "sandeep@systems:~$"
  
  # Techie aesthetic
  fullWidthTheme = false
  centerTheme = true

[menu]
  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/"
    weight = 10
  [[menu.main]]
    identifier = "github"
    name = "GitHub"
    url = "https://github.com/sandeep-alajangi"
    weight = 20
